# Overlay on config.base.yaml for the initial scenarios (baseline, High Need,
# Low Need) defined in scenarios.yaml.

run:
  name: [baseline, high-need, low-need]

catf_model:
  post_processing:
    # Comparison plots in results/catf/comparison_plots/initial/
    comparison: initial
    # Rows of the system cost sensitivity plot: label -> [low run, high run]
    sensitivity:
      pairs:
        Need (costs, demand, flexibility): [low-need, high-need]

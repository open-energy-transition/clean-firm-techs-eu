# Established-technology cost sensitivity (solar, wind, batteries, gas).
# All other assumptions are inherited from config.base.yaml.
# Scaled cost files are built by rule build_cost_sensitivity
# (rules/catf_model/cost_sensitivity.smk); the factor is taken from the file name.

catf-cost-central: {}

catf-cost-high:
  costs:
    custom_cost_fn: resources/{run}/custom_costs_x1.33.csv

catf-cost-low:
  costs:
    custom_cost_fn: resources/{run}/custom_costs_x0.75.csv

# Initial scenarios. High Need and Low Need scale the investment costs of
# established technologies (solar, wind, batteries, gas plants) and the gas
# fuel price by +33% and -25% compared to the baseline. In the baseline run, the default PyPSA-Eur demand response settings are inherited i.e., EV DSR is on and residential heat DSR is off. In the, high-need scenario, EV demand response is reduced to 25%
# of BEVs (default 50%); low-need scenario switches on residential heat demand response.
# High Need and Low Need scale the electricity load of households, services and
# rail by +10% and -10% in all hours. Industry and agriculture electricity have
# their own factors, kept at 1.0; transport and heating demand are not scaled.
# All other assumptions are inherited from config.base.yaml.
# Scaled cost files are built by rule build_cost_sensitivity
# (rules/catf_model/cost_sensitivity.smk); the factor is taken from the file name.
# Use {prefix} instead of a fixed run.prefix in paths (filled in by
# rules/catf_model/catf_default.smk), so add-ons like config.test.yaml work.

baseline:
  costs:
    custom_cost_fn: resources/{prefix}/{run}/custom_costs_x1.0.csv

high-need:
  sector:
    bev_dsm_availability: 0.25   # 25% of BEVs participate in DSM
    electricity_demand_factors:   # in all hours
      electricity: 1.1   # households, services, rail: +10%
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0
  costs:
    custom_cost_fn: resources/{prefix}/{run}/custom_costs_x1.33.csv

low-need:
  sector:
    electricity_demand_factors:   # in all hours
      electricity: 0.9   # households, services, rail: -10%
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0
    residential_heat:
      dsm:
        enable: true
  costs:
    custom_cost_fn: resources/{prefix}/{run}/custom_costs_x0.75.csv

# All runs share one prefix and one scenario file, so a run (e.g. baseline) is
# solved once and reused by every scenario set. The overlays (e.g.
# config.initial.yaml) only choose the runs with run.name and the folder of the
# comparison plots. Settings that change a run belong in scenarios.yaml, not in
# an overlay, otherwise its results would be rebuilt.
run:
  prefix: catf
  name: [baseline]
  scenarios:
    enable: true
    file: config/catf_model/scenarios.yaml
  # Share scenario-independent resources (e.g. clustered network, availability)
  # across the runs.
  shared_resources:
    policy: base
    # Keep processed cost files per scenario. Required because compose_network
    # requests them without the {horizon} wildcard, which "base" would treat as shared.
    exclude:
    - costs_
    # Built per run from catf_model.cost_sensitivity
    - custom_costs

planning_horizons: [2030, 2040, 2050]

foresight: myopic

sector:
  # Enabled sectors
  transport: true
  heating: true
  biomass: true
  industry: true
  agriculture: true

  # Disabled sectors
  shipping: false
  aviation: false

  # Enabled technologies
  fossil_fuels: true
  electricity_distribution_grid: true
  gas_distribution_grid: true # add capital costs to decentralized gas boilers and micro-CHPs
  gas_network: true
  co2_network: true
  ammonia: true
  methanation: true
  SMR: true
  biomass_to_liquid: true
  electrobiofuels: true
  biomass_spatial: true
  H2_network: true
  hydrogen_turbine: true

  # Demand-side flexibility (baseline: EV smart charging and V2G on, residential heat DSM off)
  bev_dsm: true
  bev_dsm_availability: 0.5
  v2g: true
  residential_heat:
    dsm:
      enable: false

  # Firm technologies excluded from baseline
  # Hydrogen to power
  hydrogen_fuel_cell: false
  hydrogen_underground_storage: false
  electrolysis: false

  # Advanced geothermal
  enhanced_geothermal:
    enable: false

  # Disabled CCS technologies
  dac: false
  SMR_cc: false
  coal_cc: false
  allam_cycle_gas: false
  biomass_to_liquid_cc: false
  biogas_upgrading_cc: false
  chp:
    fuel_cc: []

  # Methanol to power
  methanol:
    biomass_to_methanol: true
    methanol_to_power:
      ocgt: false
      ccgt: false
      ccgt_cc: false
      allam: false

  # Long-duration storage
  district_heating:
    ptes:
      enable: false

industry:
  # Disabled CCS technologies
  solid_biomass_for_industry_cc: false
  gas_for_industry_cc: false
  process_emissions_cc: false

electricity:
  powerplants_filter: "(DateOut >= 2024 or DateOut != DateOut) and (DateIn <= 2024 or DateIn != DateIn) and Fueltype not in ['Nuclear', 'Hard Coal', 'Lignite']"
  # Includes planned plants (DateIn > 2024), which are added in the horizon they come online
  custom_powerplants: "Country != 'TR' and DateOut >= 2024"
  custom_powerplants_fn: data/catf_model/custom_powerplants.csv
  extendable_carriers:
    # Long-duration electricity storage (iron-air, vanadium, compressed air) excluded
    StorageUnit: []
  transmission_limit: v1.0

# Without nuclear: it is modelled as links in the sector model
pypsa_eur:
  Generator:
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - solar-hsat
  - solar
  - ror

co2_budget:
  2040: 0.1
  2050: 0.0

catf_model:
  # Base cost adjustments of all runs (stakeholder feedback: solar +30%). Set
  # only here; scenarios scale on top of them with catf_model.cost_sensitivity.
  cost_factors:
    solar: 1.3
    solar-utility: 1.3
    solar-utility single-axis tracking: 1.3
    solar-rooftop: 1.3
    solar-rooftop commercial: 1.3
    solar-rooftop residential: 1.3

    # Per carrier, applied in add_electricity_grid_connection, as onshore wind
    # and utility solar share one cost row
    distribution grid reinforcement:
      solar: 1.3
      solar-hsat: 1.3

  # Technologies scaled per cost sensitivity group, by cost parameter
  # (column "parameter" of the technology-data cost files). grid_connection
  # lists the carriers whose grid connection cost is scaled with the group,
  # on top of the base factors above.
  cost_sensitivity_groups:
    # Solar ("solar" is overwritten by "solar-utility" in prepare_costs)
    solar:
      investment:
      - solar
      - solar-utility
      - solar-utility single-axis tracking
      - solar-rooftop
      - solar-rooftop commercial
      - solar-rooftop residential
      grid_connection:
      - solar
      - solar-hsat
    onwind:
      investment:
      - onwind
      grid_connection:
      - onwind
    # Offshore wind turbines, substations and grid connections
    offwind:
      investment:
      - offwind
      - offwind-float
      - offwind-ac-station
      - offwind-ac-connection-submarine
      - offwind-ac-connection-underground
      - offwind-dc-station
      - offwind-dc-connection-submarine
      - offwind-dc-connection-underground
      - offwind-float-station
      - offwind-float-connection-submarine
      - offwind-float-connection-underground
    # Batteries (combined battery costs are derived from these in prepare_costs)
    battery:
      investment:
      - battery storage
      - battery inverter
      - home battery storage
      - home battery inverter
    gas-plants:
      investment:
      - OCGT
      - CCGT
      - central gas CHP
    gas-fuel:
      fuel:
      - gas
    # Solid biomass power plants (new and existing urban central CHPs).
    biomass-plants:
      investment:
      - central solid biomass CHP

costs:
  # Built per run by build_cost_sensitivity, so the baseline cost factors
  # (catf_model.cost_factors, e.g. solar +30%) always apply. {prefix} is filled
  # in by rules/catf_model/catf_default.smk.
  custom_cost_fn: resources/{prefix}/{run}/custom_costs.csv

clustering:
  cluster_network:
    n_clusters: 40
  temporal:
    segmentation: 1460

solving:
  options:
    load_sinks:
      enable: true
      all_carriers: false
      carriers:
        co2: 1000   # EUR/tCO2
  solver_options:
    gurobi-default:
      threads: 8

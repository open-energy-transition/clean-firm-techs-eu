# Overlay on config.base.yaml for the individual sensitivities defined in
# scenarios.yaml. The baseline is shared with the initial scenarios and solved
# only once.

run:
  name:
  - baseline
  - high-solar
  - low-solar
  - high-wind
  - low-wind
  - high-battery
  - low-battery
  - high-gas
  - low-gas
  - high-gas-fuel
  - low-gas-fuel
  - high-biomass
  - low-biomass
  - high-need-dsm
  - low-need-dsm
  - high-demand
  - low-demand

catf_model:
  post_processing:
    # Comparison plots in results/catf/comparison_plots/sensitivity/
    comparison: sensitivity
    # Rows of the system cost sensitivity plot: label -> [low run, high run]
    sensitivity:
      pairs:
        Solar investment: [low-solar, high-solar]
        Wind investment: [low-wind, high-wind]
        Battery investment: [low-battery, high-battery]
        Gas plant investment: [low-gas, high-gas]
        Gas fuel price: [low-gas-fuel, high-gas-fuel]
        Biomass plant investment: [low-biomass, high-biomass]
        Electricity demand ±10%: [low-demand, high-demand]
        Demand flexibility: [low-need-dsm, high-need-dsm]

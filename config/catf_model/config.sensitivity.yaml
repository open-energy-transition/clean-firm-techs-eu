# Overlay on config.base.yaml for the individual sensitivities defined in
# scenarios.yaml. The baseline is shared with the initial scenarios and solved
# only once.

run:
  name:
  - baseline
  - high-solar
  - low-solar
  - high-wind
  - low-wind
  - high-battery
  - low-battery
  - high-gas
  - low-gas
  - high-gas-fuel
  - low-gas-fuel
  - high-biomass
  - low-biomass
  - high-need-dsm
  - low-need-dsm
  - high-demand
  - low-demand
  - optimal-transmission-expansion
  - volumetric-transmission-expansion

catf_model:
  post_processing:
    # Comparison plots in results/catf/comparison_plots/sensitivity/
    comparison: sensitivity

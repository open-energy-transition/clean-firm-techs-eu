# CATF scenarios; everything not set here comes from config.base.yaml.
# Cost factors are per group of catf_model.cost_sensitivity_groups
# (config.base.yaml), on top of the base cost factors (solar +30%).

# --- Initial scenarios ---

baseline: {}

high-need:
  sector:
    bev_dsm_availability: 0.25   # 25% of BEVs participate in DSM (default 50%)
    electricity_demand_factors:   # in all hours
      electricity: 1.1   # households, services, rail: +10%
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0
  catf_model:
    cost_sensitivity:   # biomass plants stay at baseline
      solar: 1.33
      onwind: 1.33
      offwind: 1.33
      battery: 1.33
      gas-plants: 1.33
      gas-fuel: 1.33

low-need:
  sector:
    electricity_demand_factors:   # in all hours
      electricity: 0.9   # households, services, rail: -10%
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0
    residential_heat:
      dsm:
        enable: true
  catf_model:
    cost_sensitivity:   # biomass plants stay at baseline
      solar: 0.75
      onwind: 0.75
      offwind: 0.75
      battery: 0.75
      gas-plants: 0.75
      gas-fuel: 0.75

# --- Individual sensitivities: one change from the baseline each ---

# Solar PV and its grid connection
high-solar:
  catf_model:
    cost_sensitivity:
      solar: 1.33
low-solar:
  catf_model:
    cost_sensitivity:
      solar: 0.75

# Onshore and offshore wind
high-wind:
  catf_model:
    cost_sensitivity:
      onwind: 1.33
      offwind: 1.33
low-wind:
  catf_model:
    cost_sensitivity:
      onwind: 0.75
      offwind: 0.75

# Li-ion batteries
high-battery:
  catf_model:
    cost_sensitivity:
      battery: 1.33
low-battery:
  catf_model:
    cost_sensitivity:
      battery: 0.75

# Gas plant investment costs
high-gas:
  catf_model:
    cost_sensitivity:
      gas-plants: 1.33
low-gas:
  catf_model:
    cost_sensitivity:
      gas-plants: 0.75

# Gas fuel price
high-gas-fuel:
  catf_model:
    cost_sensitivity:
      gas-fuel: 1.33
low-gas-fuel:
  catf_model:
    cost_sensitivity:
      gas-fuel: 0.75

# Solid biomass CHP investment costs
high-biomass:
  catf_model:
    cost_sensitivity:
      biomass-plants: 1.33
low-biomass:
  catf_model:
    cost_sensitivity:
      biomass-plants: 0.75

# Demand-side flexibility
high-need-dsm:
  sector:
    bev_dsm_availability: 0.25
low-need-dsm:
  sector:
    residential_heat:
      dsm:
        enable: true

# Electricity demand of households, services and rail
high-demand:
  sector:
    electricity_demand_factors:
      electricity: 1.1
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0
low-demand:
  sector:
    electricity_demand_factors:
      electricity: 0.9
      industry electricity: 1.0
      agriculture electricity: 1.0
      agriculture machinery electric: 1.0

transmission-optimal-expansion:
  electricity:
    transmission_limit: copt
transmission-volume-1.25: # transmission expansion limit of 1.25x / 1.56x / 1.95x the baseline transmission volume (for 2030 / 2040 / 2050)
  electricity:
    transmission_limit: v1.25

# --- Advanced technologies: buildable from 2040, absolute costs in 2040 and 2050 ---
# Costs in catf_model.cost_overwrites apply in catf_model.cost_overwrite_years,
# in technology-data units. Each technology is made buildable with a potential
# of zero in 2030 (adjustments per planning horizon).

# New-build nuclear, CATF nuclear team (2025 EUR). PyPSA: 10806 EUR/kW, 40 years
high-nuclear:   # committed series
  sector:
    conventional_generation:   # new-build nuclear besides the gas plants
      OCGT: gas
      CCGT: gas
      nuclear: uranium
  adjustments:
    sector:
      absolute:
        Link:
          nuclear:   # new build from 2040; existing plants are not extendable
            p_nom_max: {2030: 0, 2040: .inf, 2050: .inf}
  catf_model:
    cost_overwrites:
      nuclear:
        investment: 8880   # EUR/kW_e
        lifetime: 40       # financial lifetime, years
low-nuclear:    # standardised European fleet with state financing
  sector:
    conventional_generation:
      OCGT: gas
      CCGT: gas
      nuclear: uranium
  adjustments:
    sector:
      absolute:
        Link:
          nuclear:
            p_nom_max: {2030: 0, 2040: .inf, 2050: .inf}
  catf_model:
    cost_overwrites:
      nuclear:
        investment: 6490   # EUR/kW_e
        lifetime: 60       # financial lifetime, years

# Enhanced geothermal (EGS) from site-level GEOELEC supply curves
# (scripts/build_egs_supply_curves.py), instead of the default Aghahosseini &
# Breyer data. Costs come from the supply curve, not from technology-data, so
# catf_model.cost_overwrites do not apply.
high-geothermal:
  sector:
    enhanced_geothermal:
      enable: true
      supply_curve: &egs_supply_curve
        # --- data
        # Site-level costs in the EU_EGS_SupplyCurves_GEOELEC.csv format
        cost_data: data/egs/EU_EGS_SupplyCurves_GEOELEC.csv
        # Optional per-year files in the same format; a horizon uses the latest
        # entry at or before it. Membership and potentials always come from cost_data.
        cost_data_by_year: {}
        # Data are 2025 EUR, the same as technology-data
        currency_factor: 1.0
        # Per-year factors on subsurface (wells) and surface (ORC) costs,
        # linear in between, flat outside
        cost_multipliers:
          subsurface: {}
          surface: {}

        # --- resource selection
        cost_metric: TotAnn   # ranking and clustering metric: TotAnn or CAPEX
        min_resource_mw: 0    # drop (cell, depth) resources below this size
        # Country caps (GW), allocated cheapest-first after every region gets
        # its cheapest min_potential_per_region_gw
        max_potential_gw:
          default: 25
          IT: 400
          HU: 400
          DE: 400
          ES: 175
          FR: 175
          PL: 125
          BG: 125
          GB: 125
          DK: 125
        min_potential_per_region_gw: 20
        # Supply-curve steps per region (Ward clustering, all depths pooled)
        n_clusters:
          default: 4
          IT: 8
          HU: 8
          DE: 8
          ES: 6
          FR: 6
          PL: 6
          BG: 6
          GB: 6
          DK: 6

        # --- surface (ORC) price: one per bus, the capacity-weighted quantile
        # over the cheapest surface_cost_reference_gw of the bus's supply curve
        surface_cost_reference_gw: 20
        surface_cost_quantile: 0.5
        well_cost_basis: subsurface   # or total_minus_surface

        # --- performance
        capacity_factor_scale: 0.9357   # availability derate (1.0: PyPSA-Eur default)
        snap_distance_km: 10            # snap coastal cells to a region within this distance
  adjustments:
    sector:
      factor:   # factor, not absolute, to keep the supply-curve potential per step
        Link:
          geothermal heat:   # EGS wells: new build from 2040
            p_nom_max: {2030: 0, 2040: 1, 2050: 1}
low-geothermal:
  sector:
    enhanced_geothermal:
      enable: true
      supply_curve:
        <<: *egs_supply_curve
        cost_multipliers:   # on the supply-curve costs, in all horizons
          subsurface: {2040: 0.5, 2050: 0.5}    # wells -50%
          surface: {2040: 0.85, 2050: 0.85}     # ORC -15%
  adjustments:
    sector:
      factor:
        Link:
          geothermal heat:
            p_nom_max: {2030: 0, 2040: 1, 2050: 1}
